apiVersion: batch/v1
kind: Job
metadata:
  name: modus-repro-{{ORX_RUN}}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 21600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: run
          image: python:3.11-slim
          command: ["bash", "-lc", "eval \"$ORX_SCRIPT\""]
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
