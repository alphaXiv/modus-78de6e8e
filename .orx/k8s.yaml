apiVersion: batch/v1
kind: Job
metadata:
  name: modus-repro-{{ORX_RUN}}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 21600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: run
          image: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime
          command: ["bash", "-lc", "eval \"$ORX_SCRIPT\""]
          env:
            - name: HF_HOME
              value: /workspace/cache/huggingface
            - name: PIP_CACHE_DIR
              value: /workspace/cache/pip
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              nvidia.com/gpu: "4"
              cpu: "24"
              memory: "400Gi"
            limits:
              nvidia.com/gpu: "4"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      volumes:
        - name: workspace
          emptyDir:
            sizeLimit: 100Gi
